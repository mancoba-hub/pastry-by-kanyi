# Local development dependencies.
#
# Postgres only — the app itself runs on `next dev`, so there is no application
# container here. For a self-hosted production deployment see docs/DEPLOYMENT.md.
#
#   docker compose up -d
#   npm run db:deploy && npm run db:seed
#
# Host port 5433 avoids colliding with a Postgres already installed on 5432.

services:
  postgres:
    image: postgres:17-alpine
    container_name: pbk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pastry
      POSTGRES_PASSWORD: pastry
      POSTGRES_DB: pastry
      # Deterministic collation regardless of the host machine's locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - pbk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pastry -d pastry"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pbk-pgdata:
