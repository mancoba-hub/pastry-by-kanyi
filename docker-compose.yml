# Local development dependencies.
#
# MariaDB only — the app itself runs on `next dev`, so there is no application
# container here. For a self-hosted production deployment see docs/DEPLOYMENT.md.
#
#   docker compose up -d
#   npm run db:deploy && npm run db:seed
#
# Host port 3307 avoids colliding with a MySQL/MariaDB already installed on
# 3306. The image tracks the MariaDB 10.11 LTS line that shared cPanel hosts
# (HostAfrica included) commonly run, so local behaviour matches production.
#
# Credentials here match the DATABASE_URL in .env.example — they are for local
# development only and must never be reused on a public host.

services:
  mariadb:
    image: mariadb:10.11
    container_name: pbk-mariadb
    restart: unless-stopped
    environment:
      MARIADB_USER: pastry
      MARIADB_PASSWORD: pastry
      MARIADB_DATABASE: pastry
      MARIADB_ROOT_PASSWORD: pastry-root
    ports:
      - "3307:3306"
    volumes:
      - pbk-mariadbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  pbk-mariadbdata:
